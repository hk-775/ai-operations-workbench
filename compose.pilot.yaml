name: ai-operations-workbench-pilot
x-runtime: &runtime
  image: ai-operations-workbench:pilot
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  user: "${WORKBENCH_RUN_UID:-10001}:${WORKBENCH_RUN_GID:-10001}"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
  environment:
    WORKBENCH_MODE: pilot
    WORKBENCH_DATABASE_URL_FILE: /run/secrets/database_url
    WORKBENCH_PUBLIC_ORIGIN: "${WORKBENCH_PUBLIC_ORIGIN:-http://127.0.0.1:8768}"
  secrets: [database_url]
  depends_on:
    db:
      condition: service_healthy
  mem_limit: 768m
  cpus: 1.5

services:
  db:
    image: ai-operations-workbench-postgres:0.2.0
    build:
      context: ./deploy/images
      dockerfile: Dockerfile.postgres
      args: {GOPROXY: "${WORKBENCH_GOPROXY:-https://proxy.golang.org,direct}"}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    volumes:
      - pilot_data:/var/lib/postgresql/data
      - ./.pilot/init.sql:/docker-entrypoint-initdb.d/workbench.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1
  app:
    <<: *runtime
    ports:
      - "127.0.0.1:${WORKBENCH_PILOT_PORT:-8768}:8768"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  worker:
    <<: *runtime
    command: ["python", "-m", "workbench.pilot", "worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "--worker"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 30s

secrets:
  database_url:
    file: .pilot/database_url
  postgres_admin_password:
    file: .pilot/postgres_admin_password
volumes:
  pilot_data:
