groups:
  - name: workbench
    rules:
      - alert: WorkbenchUnavailable
        expr: up{job="workbench"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Workbench cannot be scraped
          description: Check TLS, monitoring credentials, the proxy, and the API service.
      - alert: WorkbenchWorkerUnavailable
        expr: workbench_worker_healthy == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Evaluation worker is unavailable
          description: Inspect worker and database health before restarting; leased jobs recover automatically.
      - alert: WorkbenchQueueStalled
        expr: workbench_oldest_queued_seconds > 300
        for: 2m
        labels: {severity: warning}
        annotations: {summary: Evaluations have waited over five minutes}
      - alert: WorkbenchMaintenanceLate
        expr: workbench_maintenance_age_seconds > 7200 or workbench_maintenance_age_seconds < 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: Data maintenance has not completed in two hours}
      - alert: WorkbenchUnknownCosts
        expr: workbench_unknown_cost_calls_24h / clamp_min(workbench_observed_calls_24h, 1) > 0.05
        for: 15m
        labels: {severity: warning}
        annotations: {summary: More than five percent of observed calls have unknown costs}
      - alert: WorkbenchServerErrors
        expr: sum(rate(workbench_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(workbench_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: critical}
        annotations: {summary: More than one percent of requests are failing}
      - alert: WorkbenchUsageCollectorStale
        expr: workbench_stale_usage_sources > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: A usage collector has stopped reporting
          description: Check Usage sources, its application host, source token, and delivery supervisor. Missing costs are unknown.
      - alert: WorkbenchUsageDeliveryBacklog
        expr: workbench_backlog_usage_sources > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A usage source continues to report undelivered events
          description: Inspect the local outbox and delivery errors. Reported queue counts may be stale.
      - alert: WorkbenchBillingCollectionFailed
        expr: workbench_failed_billing_collectors > 0 or workbench_stale_billing_collectors > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Billing collection failed or stopped reporting
          description: Check the collector host, AWS access and complete versioned export. The last accepted snapshot remains available.
      - alert: WorkbenchSpendBudgetReached
        expr: workbench_spend_budget_breaches > 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Tracked spending has reached a budget limit
          description: Review Spend planning and its cost basis. Uncaptured or unpriced amounts may increase the total; this alert does not block model calls.
      - alert: WorkbenchSpendBudgetWarning
        expr: workbench_spend_budget_warnings > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A spend budget needs review
          description: Inspect the warning threshold or captured-pace projection in Spend planning. A projection is not a verified invoice.
