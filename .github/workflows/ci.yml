name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: workbench
          POSTGRES_DB: workbench
          POSTGRES_PASSWORD: isolated-ci-database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WORKBENCH_TEST_DATABASE_URL: postgresql+psycopg://workbench:isolated-ci-database@127.0.0.1:5432/workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.7"
          enable-cache: false
      - run: uv sync --locked --python "${{ matrix.python }}"
      - run: uv run --locked pytest -q
      - run: git diff --exit-code -- uv.lock

  browser:
    name: Browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: workbench
          POSTGRES_DB: workbench
          POSTGRES_PASSWORD: isolated-ci-database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WORKBENCH_TEST_DATABASE_URL: postgresql+psycopg://workbench:isolated-ci-database@127.0.0.1:5432/workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.7"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: uv sync --locked --python 3.13
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --reporter=line
      - run: npx playwright test --config=playwright.pilot.config.js --reporter=line
      - run: git diff --exit-code -- uv.lock package-lock.json
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence
          path: |
            artifacts/screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  pilot-container:
    name: Pilot container and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start an isolated pilot
        run: |
          python3 scripts/setup_pilot.py
          docker compose --env-file .pilot/compose.env -f compose.pilot.yaml up --build --wait
      - name: Verify bootstrap, offline evaluation, and backup restore
        run: python3 scripts/check_pilot_stack.py
      - name: Verify seeded and clean customer deployments
        run: |
          python3 scripts/deploy_instances.py
          python3 scripts/verify_instances.py
          python3 scripts/check_pilot_stack.py --env-file .pilot/instances/demo/compose.env --compose-file compose.instances.yaml
      - name: Install verified container scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Check runtime images for high and critical vulnerabilities
        run: |
          docker build -f deploy/images/Dockerfile.proxy -t ai-operations-workbench-proxy:0.2.0 deploy/images
          "$RUNNER_TEMP/trivy" image --exit-code 1 --scanners vuln --severity HIGH,CRITICAL ai-operations-workbench:test-release
          "$RUNNER_TEMP/trivy" image --exit-code 1 --scanners vuln --severity HIGH,CRITICAL ai-operations-workbench-postgres:0.2.0
          "$RUNNER_TEMP/trivy" image --exit-code 1 --scanners vuln --severity HIGH,CRITICAL ai-operations-workbench-proxy:0.2.0
      - name: Clean up isolated CI services
        if: always()
        run: |
          docker compose --env-file .pilot/compose.env -f compose.pilot.yaml down --volumes
          if test -f .pilot/instances/demo/compose.env; then docker compose --env-file .pilot/instances/demo/compose.env -f compose.instances.yaml down --volumes; fi
          if test -f .pilot/instances/clean/compose.env; then docker compose --env-file .pilot/instances/clean/compose.env -f compose.instances.yaml down --volumes; fi

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.10.7"
      - run: uv export --locked --no-dev --no-hashes --no-emit-project --no-emit-package axon-llm --no-emit-package ostiari --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
      - run: uvx --from pip-audit==2.9.0 pip-audit --disable-pip --no-deps --requirement "$RUNNER_TEMP/requirements.txt"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
